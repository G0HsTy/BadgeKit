<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>BadgeKit Gallery</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#000; --bg2:#000; --card:#0a0a0a; --card2:#141414; --line:rgba(255,255,255,.12); --line2:rgba(255,255,255,.24);
  --text:#fff; --muted:#a3a3a3; --accent:#fff; --accent2:#fff; --ok:#fff;
  --r:18px; --ease:cubic-bezier(.2,.8,.2,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh;overflow-x:hidden}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.wrap{position:relative;z-index:1;max-width:1180px;margin:0 auto;padding:0 20px}

/* hero */
.hero{padding:72px 0 36px;text-align:center}
.badge-chip{display:inline-flex;align-items:center;gap:8px;padding:6px 12px;border:1px solid var(--line2);border-radius:999px;font-size:12px;color:var(--muted);background:rgba(255,255,255,.03)}
.badge-chip i{width:6px;height:6px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 0 rgba(255,255,255,.6);animation:pulse 2s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 8px rgba(255,255,255,0)}100%{box-shadow:0 0 0 0 rgba(255,255,255,0)}}
h1{font-size:clamp(34px,6vw,60px);letter-spacing:-.035em;line-height:1.04;margin:18px 0 14px;font-weight:800}
h1 em{font-style:normal;color:#fff}
.hero p{max-width:560px;margin:0 auto;color:var(--muted);font-size:16px;line-height:1.6}
.stats{display:flex;justify-content:center;gap:28px;margin-top:28px;flex-wrap:wrap}
.stat b{display:block;font-size:26px;letter-spacing:-.02em}
.stat span{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}

/* section titles */
.sec{padding:34px 0 10px}
.sec h2{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:16px}

/* featured packs */
.packs{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.pack{background:#000;border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:14px;transition:.35s var(--ease);position:relative;overflow:hidden}
.pack:hover{transform:translateY(-4px);border-color:var(--line2);box-shadow:0 20px 50px rgba(0,0,0,.45)}
.pack .tag{font-size:11px;color:var(--muted);font-weight:600;letter-spacing:.08em;text-transform:uppercase}
.pack h3{font-size:20px;letter-spacing:-.02em}
.pack .count{font-size:13px;color:var(--muted)}
.marquee{height:92px;border-radius:12px;background:#000;border:1px solid var(--line);overflow:hidden;position:relative;display:flex;flex-direction:column;justify-content:center;gap:8px;mask-image:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent)}
.mrow{display:flex;gap:10px;width:max-content;animation:slide 26s linear infinite}
.mrow:nth-child(2){animation-direction:reverse;animation-duration:32s}
.mrow img{height:30px;width:auto;flex:none}
@keyframes slide{to{transform:translateX(-50%)}}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:10px 14px;border-radius:12px;font-size:13px;font-weight:600;border:1px solid var(--line2);background:rgba(255,255,255,.04);transition:.25s var(--ease);flex:1;min-width:max-content}
.btn:hover{background:rgba(255,255,255,.1);transform:translateY(-1px)}
.btn.primary{background:var(--text);color:#111;border-color:transparent}
.btn.primary:hover{background:#fff}
.btn svg{width:15px;height:15px;flex:none}
.btn.ok{background:#fff!important;color:#000!important;border-color:transparent}

/* gallery toolbar */
.toolbar{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px;position:relative}
.seg button{padding:9px 16px;border-radius:10px;font-size:13px;font-weight:600;color:var(--muted);position:relative;z-index:1;transition:color .25s}
.seg button.on{color:#111}
.seg .thumb{position:absolute;top:4px;bottom:4px;border-radius:10px;background:var(--text);transition:.35s var(--ease);z-index:0}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 14px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:7px 13px;border-radius:999px;border:1px solid var(--line);font-size:12.5px;font-weight:500;color:var(--muted);background:var(--card);transition:.25s var(--ease)}
.chip:hover{color:var(--text);border-color:var(--line2)}
.chip.on{background:#fff;border-color:#fff;color:#000}
.chip small{opacity:.6;margin-left:5px}

.bar{display:flex;align-items:center;justify-content:space-between;margin:2px 0 14px;gap:10px;flex-wrap:wrap}
.bar .info{font-size:13px;color:var(--muted)}

/* grid */
.group-title{display:flex;align-items:center;gap:10px;margin:26px 0 12px;font-size:15px;font-weight:700;letter-spacing:-.01em}
.group-title span{font-size:12px;font-weight:500;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:2px 9px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.card{--rx:0deg;--ry:0deg;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:12px;cursor:pointer;text-align:left;position:relative;overflow:hidden;
  transform:perspective(700px) rotateX(var(--rx)) rotateY(var(--ry));transition:transform .2s ease,border-color .25s,background .25s,box-shadow .3s;opacity:0;translate:0 14px}
.card.in{opacity:1;translate:0 0;transition:transform .2s ease,border-color .25s,background .25s,box-shadow .3s,opacity .5s var(--ease),translate .5s var(--ease)}
.card:hover{border-color:var(--line2);background:var(--card2);box-shadow:0 14px 34px rgba(0,0,0,.45)}
.card::after{content:"";position:absolute;inset:0;background:radial-gradient(220px circle at var(--mx,50%) var(--my,0%),rgba(255,255,255,.09),transparent 60%);opacity:0;transition:.3s;pointer-events:none}
.card:hover::after{opacity:1}
.stage{height:78px;border-radius:11px;background:#000;border:1px solid var(--line);display:grid;place-items:center;overflow:hidden}
.stage.light{background:#e9e9ee}
.stage img{max-width:84%;max-height:56px;object-fit:contain;transition:transform .4s var(--ease)}
.card:hover .stage img{transform:scale(1.08)}
.card .nm{font-size:13.5px;font-weight:600;letter-spacing:-.01em}
.card .id{font-size:11.5px;color:var(--muted);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;margin-top:2px}
.card .miss{font-size:11px;color:var(--muted)}
.empty{padding:60px 0;text-align:center;color:var(--muted)}

/* modal */
.overlay{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.66);backdrop-filter:blur(10px);display:none;align-items:center;justify-content:center;padding:18px;opacity:0}
.overlay.show{display:flex;animation:fade .25s forwards}
@keyframes fade{to{opacity:1}}
.modal{width:min(760px,100%);max-height:92vh;overflow:auto;background:var(--bg2);border:1px solid var(--line2);border-radius:24px;box-shadow:0 40px 100px rgba(0,0,0,.7);transform:translateY(24px) scale(.96);opacity:0;animation:pop .45s var(--ease) .05s forwards}
@keyframes pop{to{transform:none;opacity:1}}
.mh{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg2);z-index:2}
.mh h4{font-size:15px}
.x{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:rgba(255,255,255,.06);transition:.2s}
.x:hover{background:rgba(255,255,255,.14);transform:rotate(90deg)}
.mb{padding:20px}
.big{height:220px;border-radius:18px;border:1px solid var(--line);display:grid;place-items:center;position:relative;overflow:hidden;background:#000}
.big img{max-width:72%;max-height:150px;position:relative;animation:float 4s ease-in-out infinite;filter:drop-shadow(0 18px 24px rgba(0,0,0,.5))}
@keyframes float{50%{transform:translateY(-8px)}}
.bgs{display:flex;gap:8px;margin:14px 0 4px;align-items:center;flex-wrap:wrap}
.bgs span{font-size:12px;color:var(--muted);margin-right:4px}
.sw{width:26px;height:26px;border-radius:8px;border:2px solid var(--line2);transition:.2s}
.sw.on{border-color:var(--accent);transform:scale(1.12)}
.rows{display:grid;gap:10px;margin-top:16px}
.row{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;gap:12px;align-items:center;justify-content:space-between}
.row .k{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin-bottom:4px}
.row .v{font-size:12.5px;font-family:ui-monospace,Menlo,monospace;color:#d8d8de;word-break:break-all}
.row .btn{flex:none;min-width:auto;padding:8px 12px}
.nav2{display:flex;justify-content:space-between;margin-top:16px;gap:8px}

/* live preview */
.lp{width:min(720px,100%)}
.lp .mb{display:block}
.stream{min-width:0}
.lp-r{display:flex;flex-direction:column;gap:14px;min-width:0}
.ctl{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.ctl .seg button{padding:7px 13px}
.streams{display:grid;gap:10px}
.stream{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;gap:12px;align-items:center;justify-content:space-between;opacity:0;transform:translateX(18px);animation:in .5s var(--ease) forwards;transition:.25s}
.stream:hover{border-color:var(--accent);background:var(--card2)}
@keyframes in{to{opacity:1;transform:none}}
.stream .t{min-width:0}
.stream .t b{display:block;font-size:13px;margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stream .t span{font-size:11.5px;color:var(--muted)}
.stream .bd{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;max-width:56%}
.stream .bd img{height:22px;width:auto;transition:transform .3s var(--ease)}
.stream:hover .bd img{transform:translateY(-2px) scale(1.06)}
.tg{display:flex;flex-wrap:wrap;gap:6px}
.tg button{font-size:12px;padding:6px 10px;border-radius:999px;border:1px solid var(--line);color:var(--muted);transition:.2s}
.tg button.on{background:#fff;color:#000;border-color:#fff}

/* footer */
footer{margin-top:70px;padding:30px 0 50px;border-top:1px solid var(--line);color:var(--muted);font-size:13px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
footer a{color:var(--text)}
footer a:hover{text-decoration:underline}

/* toast */
.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,30px);background:#fff;color:#111;font-weight:600;font-size:13px;padding:11px 16px;border-radius:12px;z-index:200;opacity:0;pointer-events:none;transition:.35s var(--ease);box-shadow:0 14px 40px rgba(0,0,0,.5);display:flex;gap:8px;align-items:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast svg{width:16px;height:16px;color:#000}

.rv{opacity:0;transform:translateY(18px);transition:opacity .7s var(--ease),transform .7s var(--ease)}
.rv.in{opacity:1;transform:none}

@media(max-width:860px){
  .packs{grid-template-columns:1fr}
  .stream{flex-direction:column;align-items:flex-start}
  .stream .bd{max-width:100%;justify-content:flex-start}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.card,.rv{opacity:1;translate:none;transform:none}}
</style>
</head>

        <text x="32" y="34" font-family="Inter,Arial,sans-serif" font-size="38" font-weight="800"

</main>

const PACKS=DATA.packs, GROUPS=DATA.groups, BADGES=DATA.badges;

const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const imgURL=(p,b)=>RAW+encodeURI(PACKS[p].folder)+"/"+b.file;
const jsonURL=p=>RAW+encodeURI(PACKS[p].json);
const has=(p,b)=>!(b.missing||[]).includes(p);
const ICON={copy:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>',
 play:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 3l14 9-14 9V3z"/></svg>',
 gh:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7h10v10M7 17 17 7"/></svg>',
 x:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>'};

let state={pack:0,group:'all',q:''};

/* ---------- clipboard + toast ---------- */
let tt;
function toast(t){const el=$('#toast');$('#toastT').textContent=t;el.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>el.classList.remove('show'),1800)}
async function copy(text,label,btn){
  try{await navigator.clipboard.writeText(text)}catch(e){
    const ta=document.createElement('textarea');ta.value=text;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();try{document.execCommand('copy')}catch(_){ }ta.remove();
  }
  toast(label||'Copied');
  if(btn){const h=btn.innerHTML;btn.classList.add('ok');btn.innerHTML='Copied!';setTimeout(()=>{btn.classList.remove('ok');btn.innerHTML=h},1300)}
}

/* ---------- stats ---------- */
$('#stats').innerHTML=[[BADGES.length,'Badges'],[PACKS.length,'Styles'],[GROUPS.length,'Categories']].map(([n,l])=>`<div class="stat"><b data-n="${n}">0</b><span>${l}</span></div>`).join('');
function countUp(){$$('.stat b').forEach(b=>{const n=+b.dataset.n;let i=0;const s=performance.now();(function f(t){const p=Math.min(1,(t-s)/900);b.textContent=Math.round(n*(1-Math.pow(1-p,3)));if(p<1)requestAnimationFrame(f)})(s)})}
countUp();

/* ---------- featured packs ---------- */
function marqueeImgs(p,ids){
  const list=ids.map(id=>BADGES.find(b=>b.file.replace('.png','')===id)).filter(b=>b&&has(p,b));
  const html=[...list,...list].map(b=>`<img loading="lazy" src="${imgURL(p,b)}" alt="">`).join('');
  return html;
}
$('#packsEl').innerHTML=PACKS.map((pk,i)=>{
  const a=marqueeImgs(i,['hero-remux','hero-4k','hero-dv','hero-atmos','hero-cached','netflix','hdr10plus','truehd']);
  const b=marqueeImgs(i,['4k','1080p','dolby-vision','dts','hevc','av1','prime','disney','rd','torbox']);
  return `<article class="pack rv">
    <div><div class="tag">${esc(pk.tag)}</div><h3>${esc(pk.name)}</h3><div class="count">${BADGES.filter(x=>has(i,x)).length} badges · ${esc(pk.json)}</div></div>
    <div class="marquee"><div class="mrow">${a}</div><div class="mrow">${b}</div></div>
    <div class="actions">
      <button class="btn primary" data-act="copy" data-p="${i}">${ICON.copy}Copy JSON link</button>
      <button class="btn" data-act="live" data-p="${i}">${ICON.play}Live preview</button>
    </div></article>`}).join('');
$('#packsEl').addEventListener('click',e=>{
  const b=e.target.closest('button[data-act]');if(!b)return;const p=+b.dataset.p;
  if(b.dataset.act==='copy')copy(jsonURL(p),'JSON link copied',b);
  if(b.dataset.act==='live')openLive(p);});

/* ---------- modal helpers ---------- */
const ov=$('#ov'),modal=$('#modal');
function openModal(html,cls){modal.className='modal '+(cls||'');modal.innerHTML=html;ov.classList.add('show');document.body.style.overflow='hidden';modal.querySelector('.x').onclick=closeModal}
function closeModal(){ov.classList.remove('show');document.body.style.overflow='';modal.innerHTML='';cur=null}
ov.addEventListener('mousedown',e=>{if(e.target===ov)closeModal()});
let cur=null;
addEventListener('keydown',e=>{
  if(!ov.classList.contains('show'))return;
  if(e.key==='Escape')closeModal();
});

/* ---------- live preview ---------- */
const SCENARIOS=[
 {t:'Dune.Part.Two.2024.2160p.UHD.BluRay.REMUX.DV.HDR10+.HEVC.TrueHD.7.1.Atmos',s:'Torrentio · 62.4 GB',b:['source-remux','4k','dv-hdr10plus','hevc','atmos','7-1','mkv','rd']},
 {t:'Dune.Part.Two.2024.2160p.NF.WEB-DL.DDP5.1.Atmos.DV.HEVC',s:'Torrentio · 21.8 GB',b:['source-webdl','4k','dolby-vision','hevc','atmos','5-1','netflix','torbox']},
 {t:'Dune.Part.Two.2024.1080p.BluRay.x264.DTS-HD.MA.5.1',s:'Torrentio · 14.2 GB',b:['source-bluray','1080p','avc','dtshd-ma','5-1','mkv','alldebrid']},
 {t:'Dune.Part.Two.2024.1080p.AMZN.WEB-DL.DDP5.1.H.264.Dual.Audio',s:'Torrentio · 6.1 GB',b:['source-webdl','1080p','avc','ddplus','dual-audio','prime','premiumize']},
 {t:'Dune.Part.Two.2024.720p.WEBRip.AAC.2.0.x265',s:'Torrentio · 1.9 GB',b:['source-webrip','720p','hevc','aac','2-0','mp4','debridlink']},
];
let lp={p:0,on:null,sc:0};
function openLive(p){
  lp.p=p;lp.on=null;lp.sc=0;
  const html=`
  <div class="mh"><h4>Live preview <span style="color:var(--muted);font-weight:500">· ${esc(PACKS[p].name)}</span></h4><button class="x" aria-label="Close">${ICON.x}</button></div>
  <div class="mb">
    <div class="lp-r">
      <div class="ctl"><button class="btn" id="lpShuf" style="flex:none">↻ Shuffle</button><button class="btn primary" id="lpCopy" style="flex:none">${ICON.copy}Copy JSON</button></div>
      <div class="tg" id="lpTg"></div>
      <div class="streams" id="lpStreams"></div>
    </div>
  </div>`;
  openModal(html,'lp');cur=null;
  lpRender(true);
}
function find(id){return BADGES.find(b=>b.file.replace('.png','')===id)}
function lpRender(first){
  const p=lp.p, sc=SCENARIOS[lp.sc];
  const all=[...new Set(sc.b)];
  if(!lp.on||first)lp.on=new Set(all);
  $('#lpTg').innerHTML=all.map(id=>{const b=find(id);return `<button data-id="${id}" class="${lp.on.has(id)?'on':''}">${esc(b.name)}</button>`}).join('');
  $('#lpTg').onclick=e=>{const b=e.target.closest('button');if(!b)return;lp.on.has(b.dataset.id)?lp.on.delete(b.dataset.id):lp.on.add(b.dataset.id);lpRender()};
  $('#lpShuf').onclick=()=>{lp.sc=(lp.sc+1)%SCENARIOS.length;lp.on=null;lpRender(true)};
  $('#lpCopy').onclick=e=>copy(jsonURL(p),'JSON link copied',e.currentTarget);
  const mk=ids=>ids.filter(id=>lp.on.has(id)).map(find).filter(b=>has(p,b)).map(b=>`<img src="${imgURL(p,b)}" alt="${esc(b.name)}">`).join('');
  $('#lpStreams').innerHTML=SCENARIOS.map((s,i)=>{
    const ids=i===lp.sc?s.b.filter(x=>lp.on.has(x)):s.b;
    return `<div class="stream" style="animation-delay:${i*70}ms;${i===lp.sc?'border-color:rgba(255,255,255,.7)':''}"><div class="t"><b>${esc(s.t)}</b><span>${esc(s.s)}</span></div><div class="bd">${mk(ids.length?ids:[])||''}</div></div>`}).join('');
  // other rows: show all their badges
  $$('#lpStreams .stream').forEach((row,i)=>{if(i!==lp.sc){row.querySelector('.bd').innerHTML=SCENARIOS[i].b.map(find).filter(b=>has(p,b)).map(b=>`<img src="${imgURL(p,b)}" alt="${esc(b.name)}">`).join('')}});
}

/* ---------- reveal on scroll ---------- */
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}}),{threshold:.12});
function observe(){$$('.rv:not(.in)').forEach(el=>io.observe(el))}

observe();
</script>
